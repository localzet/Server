name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Syntax check
        run: composer lint

      - name: Basic core static analysis
        run: composer analyze

      - name: Smoke tests
        run: composer test

      - name: Gateway smoke tests
        run: |
          php tests/gateway_smoke.php
          php tests/gateway_host_regression.php

      - name: Parser fuzz smoke
        run: php tests/fuzz_smoke.php

      - name: Memory smoke
        run: php tests/memory_smoke.php

      - name: Revolt adapter integration
        run: composer test:revolt

      - name: Gateway integration tests
        if: runner.os == 'Linux'
        run: bash tests/gateway_integration.sh

      - name: Integration tests
        if: runner.os == 'Linux'
        run: composer test:integration
